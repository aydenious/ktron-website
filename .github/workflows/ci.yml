name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  site:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm test
      - run: npm run quality
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      # The count gate reads its baseline from the branch this PR merges into, so a PR cannot
      # raise its own baseline or rewrite the history it inherited.
      - run: npm run quality -- --base origin/${{ github.base_ref || 'main' }}
      # Secrets gate: gitleaks over the full history; pinned, checksum-verified, kept in RUNNER_TEMP.
      - name: Secrets scan (gitleaks, full history)
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/gitleaks"
          rm -rf "$dir" && mkdir -p "$dir"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL --retry 3 -o "$dir/$archive" "$base/$archive"
          curl -fsSL --retry 3 -o "$dir/checksums.txt" "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          (cd "$dir" && grep " $archive\$" checksums.txt | sha256sum -c -)
          tar -xzf "$dir/$archive" -C "$dir" gitleaks
          "$dir/gitleaks" git --redact --no-banner --exit-code 1 .
